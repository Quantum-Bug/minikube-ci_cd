apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-frontend
  namespace: apps
  labels:
    app: angular-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-frontend
  template:
    metadata:
      labels:
        app: angular-frontend
        tier: frontend
    spec:
      containers:
        - name: angular-frontend
          image: angular-frontend:ea908f9-1786243887
          imagePullPolicy: Never
          ports:
            - containerPort: 80
