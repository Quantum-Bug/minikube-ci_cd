apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
  namespace: apps
  labels:
    app: python-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
        tier: backend
    spec:
      containers:
        - name: python-backend
          image: python-backend:b51a36d-1786172818
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
