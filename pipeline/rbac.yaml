apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-deployer
  namespace: ci-cd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-deploy-role
  namespace: apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-deploy-binding
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: tekton-deployer
    namespace: ci-cd
roleRef:
  kind: Role
  name: tekton-deploy-role
  apiGroup: rbac.authorization.k8s.io
