apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-deploy-pipeline
  namespace: ci-cd
spec:
  params:
    - name: repo-url
      type: string
    - name: app-path
      type: string
    - name: image-name
      type: string
    - name: manifest-path
      type: string
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: repo-url
          value: $(params.repo-url)

    - name: build
      taskRef:
        name: build-image
      runAfter: ["clone"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: app-path
          value: $(params.app-path)
        - name: image-name
          value: $(params.image-name)

    - name: update-manifest
      taskRef:
        name: update-manifest
      runAfter: ["build"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: $(tasks.build.results.image-tag)
        - name: manifest-path
          value: $(params.manifest-path)
