apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: apps
  labels:
    app: java-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
        tier: backend
    spec:
      containers:
        - name: java-backend
          image: java-backend:1a97048-1786172992
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
