apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Quantum-Bug/minikube-ci_cd.git
    targetRevision: main
    path: java-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
